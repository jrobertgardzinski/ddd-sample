name: CI

# microservice-security depends on the shared SNAPSHOT libraries, so CI checks them out (all
# public) and installs them in dependency order before building the service — independent per-push
# feedback without the whole workspace reactor. The consumer repos are checked out too, pacts
# included, so the provider verification (mail-requests, content-commands) runs here as well: a
# push that breaks a consumer's contract goes red in THIS repo. The reactor CI (in the aggregator
# repo) still validates everything together.
#
# EVERY checkout below mirrors the WORKSPACE LAYOUT — shared/<repo> for the kernel, portal/<repo>
# for the consumers that moved there in the 2026-07-12 split — because that is the layout the
# provider tests' @PactFolder paths are written against, and there is no second set of paths for
# CI. Until 2026-07-29 the checkouts were flat: ../../offline-jwt and ../../microservice-email
# happened to land right, while ../../../portal/… resolved ABOVE $GITHUB_WORKSPACE, so the /me and
# ACCOUNT_DELETION_REQUESTED verifications were @EnabledIf-skipped on every single run and this
# workflow's own claim above was false. SilentlySkippedPactTest was blind to it for the same
# reason — it read the same wrong root. Keep the shared/ and portal/ prefixes; they are load-
# bearing, not decoration.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The boot smoke below runs this service the way a deployment does, and that needs a database:
    # outside the `test` environment there is no in-memory ProcessedOutcomes, so the outcome
    # listener — and the lamp that watches it — cannot be constructed without one. Ten seconds of
    # container for the only check that exercises the wiring the image actually uses.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: security
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: shared/microservice-security

      # the shared libraries this service builds against
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/test-starter
          path: shared/test-starter
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/libs   # the constraint lib lives in repo "libs"
          path: shared/constraint
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/config
          path: shared/config
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/adjustable-clock
          path: shared/adjustable-clock
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/email
          path: shared/email
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/password
          path: shared/password
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/infrastructure-micronaut-clock
          path: shared/infrastructure-micronaut-clock
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/offline-jwt
          path: shared/offline-jwt
      # the closure vocabulary this service shares with the portal's orchestrator and participants
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/account-closure
          path: shared/account-closure

      # offline-jwt is also a consumer (the JWKS pact) and a test dependency (the round-trip);
      # the other consumers are checkout only, no build
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-email
          path: shared/microservice-email
      # the portal consumers — these four MUST sit under portal/, see the note at the top
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-memes
          path: portal/microservice-memes
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-comments
          path: portal/microservice-comments
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-user-collections
          path: portal/microservice-user-collections
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/microservice-offboarding
          path: portal/microservice-offboarding

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the shared libraries (dependency order)
        run: |
          for lib in test-starter constraint config adjustable-clock email password infrastructure-micronaut-clock offline-jwt account-closure; do
            mvn -B -q --no-transfer-progress -f "shared/$lib/pom.xml" install -DskipTests
          done

      - name: Build and test (including pact provider verification)
        run: mvn -B --no-transfer-progress -f shared/microservice-security/pom.xml clean verify

      # Does the thing we just built actually START — with the wiring it has in production?
      #
      # `mvn verify` cannot answer that, and on 2026-07-29 it failed to twice in one afternoon.
      # Tests run on the TEST classpath and construct beans by hand; the service runs on the jar
      # plus target/lib and is assembled by the container.
      #
      #  - reactor-core declared `test` (to borrow a Flux for one assertion) took Maven's
      #    nearest-definition rule at its word, dropped a RUNTIME transitive out of target/lib and
      #    killed the service on boot: NoClassDefFoundError: reactor/core/CorePublisher.
      #  - OffboardingListenerHealth had two constructors and neither was annotated, so Micronaut
      #    looked for a no-arg one, failed, and HealthEndpoint answered 500 — all three probes
      #    down, container never healthy.
      #
      # Both through completely green builds. The first version of this step ran in the `test`
      # environment, which has no Kafka layer and therefore does not construct that lamp at all —
      # so it would have caught the first failure and slept through the second. A gate that covers
      # one member of a family is not a gate for the family, so this one runs the service the way
      # a deployment does: a real environment, a real database, the Kafka layer present.
      #
      # The BROKER is deliberately absent (kafka.health.enabled=false turns off the cluster probe,
      # which is not what is being tested). That is the interesting case rather than a compromise:
      # the lamp must report the loop as polling even with nothing behind the bootstrap address,
      # because it measures the loop and not the broker.
      #
      # 500 is the failure being watched for — it means the endpoint itself is broken. 200 and 503
      # are verdicts, and both are acceptable answers.
      - name: Prove the packaged service boots and answers its probes
        run: |
          cd shared/microservice-security
          MICRONAUT_ENVIRONMENTS=dev MICRONAUT_SERVER_PORT=8181 \
            DB_HOST=localhost DB_PORT=5432 DB_NAME=security DB_USER=postgres DB_PASSWORD=secret \
            KAFKA_HEALTH_ENABLED=false SECURITY_COOKIE_SECURE=false \
            ENDPOINTS_HEALTH_DETAILS_VISIBLE=ANONYMOUS \
            java -cp "security-infrastructure/target/security-infrastructure-1.0.0-SNAPSHOT.jar:security-infrastructure/target/lib/*" \
            com.jrobertgardzinski.App > /tmp/boot-smoke.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8181/health && break
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::the packaged service died during startup"
              tail -40 /tmp/boot-smoke.log
              exit 1
            fi
            sleep 2
          done
          fail() { echo "::error::$1"; tail -40 /tmp/boot-smoke.log; kill "$pid" 2>/dev/null; exit 1; }
          for path in /health /health/readiness /health/liveness; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8181$path" || echo 000)
            case "$code" in
              200|503) echo "$path: $code" ;;
              *) fail "$path answered $code — the manifest probes it and would never pass" ;;
            esac
          done
          # and the lamp has to be IN the answer: this is the half the `test` environment could
          # never reach, and the half the second failure lived in
          curl -s http://localhost:8181/health | grep -q offboardingListener \
            || fail "the health report does not name offboardingListener — the lamp was not built"
          echo "offboardingListener is among the contributors"
          kill "$pid" 2>/dev/null || true

      # The point of the layout above. A verification that was SKIPPED reports green — that is the
      # whole failure this workflow spent weeks in — so the run has to say out loud that all FOUR
      # provider verifications executed interactions. Two of them (Jwks, MailRequests) carry the
      # same @EnabledIf skip and were witnessed by nothing until 2026-09-12; the Docker-gated
      # suites are checked below, for the same reason.
      # SilentlySkippedPactTest asserts the same thing from inside the JVM; this step is the
      # outside witness, and it is the artifact to point at when asking "did the provider
      # verification actually run in CI".
      - name: Prove the pact verifications actually ran
        if: always()
        run: |
          reports=shared/microservice-security/security-infrastructure/target/surefire-reports
          for test in MeIntrospectionPactProviderTest OffboardingFactsPactProviderTest \
                      JwksPactProviderTest MailRequestsPactProviderTest; do
            file="$reports/TEST-com.jrobertgardzinski.$test.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$test produced no surefire report — it never ran."
              ls -1 "$reports" || true
              exit 1
            fi
            cases=$(grep -c '<testcase' "$file" || true)
            skips=$(grep -c '<skipped' "$file" || true)
            if [ "$cases" -eq 0 ] || [ "$cases" -eq "$skips" ]; then
              echo "::error::$test executed no interaction ($cases case(s), $skips skipped)."
              echo "The consumer pacts are not where @PactFolder looks — check the checkout paths."
              exit 1
            fi
            echo "$test: $cases interaction(s) verified, $skips skipped."
          done

      # The same blindness one layer down: the Testcontainers suites are the ONLY place several
      # claims about MVCC, advisory locks and ON CONFLICT are settled, and @Testcontainers
      # (disabledWithoutDocker = true) turns "no Docker on this runner" into a silent green. The
      # runner has Docker, so a skip here means something broke, not that the environment is thin.
      - name: Prove the database-backed suites actually ran
        if: always()
        run: |
          reports=shared/microservice-security/security-infrastructure/target/surefire-reports
          for test in security.infrastructure.persistence.JdbcAdaptersTest \
                      security.infrastructure.persistence.SessionLineageRaceTest \
                      security.infrastructure.persistence.BruteForceRaceTest \
                      persistence.AccountDeletionSagaLatchTest \
                      persistence.RetentionReapersTest; do
            file="$reports/TEST-com.jrobertgardzinski.$test.xml"
            if [ ! -f "$file" ]; then
              echo "::error::$test produced no surefire report — it never ran."
              ls -1 "$reports" || true
              exit 1
            fi
            cases=$(grep -c '<testcase' "$file" || true)
            skips=$(grep -c '<skipped' "$file" || true)
            if [ "$cases" -eq 0 ] || [ "$cases" -eq "$skips" ]; then
              echo "::error::$test executed nothing ($cases case(s), $skips skipped) — no Docker?"
              exit 1
            fi
            echo "$test: $cases case(s) against a real database, $skips skipped."
          done

  # security-ui is NOT a Maven module (unlike memes-ui, which frontend-maven-plugin builds inside
  # the reactor), so until 2026-07-29 nothing in CI ever compiled it or ran its vitest suite. That
  # was not a theoretical gap: five dependency bumps, react and react-dom to 19 and vite to 8 among
  # them, had been reported green by a gate that never opened the directory. This job is what makes
  # those greens mean something. It does not run the cucumber-js/Playwright e2e - that needs the
  # whole identity stack up, and lives in run-e2e.sh.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: security-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # the version security-ui's own toolchain needs; vite 8 requires >= 20.19
          node-version: '22'
          cache: npm
          cache-dependency-path: security-ui/package-lock.json
      - run: npm ci
      - run: npm run build     # tsc, so type-level breakage in a bump is caught here
      - run: npm test          # vitest
